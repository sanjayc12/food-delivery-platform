server.port=8081

spring.application.name=user-service

spring.datasource.url=jdbc:mysql://localhost:3306/user_service_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.config.import=optional:configserver:http://localhost:8888

# Development convenience account. Set these environment variables to unique values before deployment.
app.admin.username=${FOODRUSH_ADMIN_USERNAME:admin}
app.admin.password=${FOODRUSH_ADMIN_PASSWORD:1234}
app.admin.email=${FOODRUSH_ADMIN_EMAIL:admin@foodrush.local}